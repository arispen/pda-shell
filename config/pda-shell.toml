# pda-shell configuration. Every visual measurement lives here so it can be
# tuned once the real 5" 1024x600 panel is available. Missing keys fall back
# to the built-in defaults (src/config.rs).
#
# Physical sizes on the target panel (5", 1024x600, ~237 ppi): 1 px is about
# 0.107 mm, so 12 px is 1.3 mm, 16 px 1.7 mm, 24 px 2.6 mm, 40 px 4.3 mm.
# See docs/ergonomics.md before judging sizes on a desktop monitor.

[design]
# Density profile laid over the values below; see [density.*] at the end.
# Override per session: dev-session.sh --density readable (or the
# PDA_SHELL_DENSITY environment variable). "pocketpc" is the candidate for
# testing on the physical panel; the values below are the compact baseline.
density = "pocketpc"
# A list: the first installed family wins. "Tahoma" is Wine's LGPL clone
# (Debian package fonts-wine, registered by scripts/setup-debian.sh).
font_family = "Tahoma, DejaVu Sans"
font_px = 12              # body text
small_font_px = 10        # secondary text (dates, file paths)
title_font_px = 12        # status bar title
date_font_px = 16         # the date on Today
top_bar_px = 24           # status bar height
bottom_bar_px = 26        # command bar height
icon_px = 16              # icons in bars, menus and lists
today_icon_px = 24        # item icons on Today, Programs and Settings
row_px = 20               # minimum height of list rows
target_px = 24            # minimum size of bar buttons, switcher and menu entries
spacing_px = 2
padding_px = 4
radius_px = 2
start_menu_width_px = 300 # the Start drop-down (both orientations)
# Applications: the shell publishes these to every program it starts
# (XSETTINGS Xft/DPI and Gtk/FontName, plus the Xft.dpi X resource). Point
# sizes scale with the DPI: 10 pt is 13.3 px at 96, 20 px at 144. Icons and
# fixed pixel geometry inside programs do not scale; see docs/ergonomics.md.
app_dpi = 96
app_font = "Tahoma 10"

[colors]
# Pocket PC 2003-style: blue status bar, silver menu bar, white surfaces.
bar_bg = "#2a62c9"        # status bar, top of the gradient
bar_bg_end = "#0c3a8e"    # status bar, bottom of the gradient
bar_fg = "#ffffff"
bar_hover = "#3d78de"
bar_pressed = "#082a68"
menu_bg = "#f7f8fa"       # command bar, top of the gradient
menu_bg_end = "#d3d9e3"   # command bar, bottom of the gradient
menu_fg = "#000000"
menu_border = "#6f7f99"
separator = "#d6dce6"     # lines between Today items and list rows
surface = "#ffffff"
surface_alt = "#eef2f8"
text = "#000000"
text_dim = "#4f5866"
accent = "#1c5bc4"        # selection
accent_fg = "#ffffff"
border = "#9aa7ba"
focus = "#ff9a00"

[input]
long_press_ms = 600       # hold time before a press becomes a right click
long_press_slop_px = 8    # movement that cancels a long press / starts a drag
double_tap_ms = 400
double_tap_slop_px = 10
feedback_delay_ms = 150   # progress ring appears after this much holding

[today]
# Favorites: shown on Today and in the Start menu. Desktop entry IDs;
# entries that are not installed are skipped.
shortcuts = [
    "thunar.desktop",
    "org.xfce.mousepad.desktop",
    "org.gnumeric.gnumeric.desktop",
    "atril.desktop",
    "firefox-esr.desktop",
    "xfce4-terminal.desktop",
]
recent_documents = 4

[keyboard]
# pda-onboard (scripts/bin) starts the distribution's Onboard with a fix for
# symbol keys on Debian 13; see the comment in that script.
command = ["pda-onboard"]
# Onboard's "Small" layout has Esc, Tab, Ctrl, Alt and arrow keys on the
# main layer (the default "Compact" layout has no Esc).
layout = "Small"

[start_menu]
# Technical utilities kept out of the program list. They are still found by
# search and listed under "Other programs". Settings dialogs (desktop
# category "Settings") are treated the same way automatically.
hidden = [
    "openbox.desktop",
    "x11vnc.desktop",
    "display-im*.desktop",
    "python3*.desktop",
    "thunar-bulk-rename.desktop",
    "onboard-settings.desktop",
    "onboard.desktop",          # the command bar has the keyboard button
]

[windows]
# "escape": programs may go full screen; a small "Exit full screen" button
#           stays on top so the stylus always has a way back.
# "prevent": the shell takes windows straight back out of full screen.
fullscreen = "escape"
# Move and shrink dialogs that are larger than the work area.
fit_dialogs = true

# --- Density profiles ----------------------------------------------------
# Candidates for the readability test on the real panel. Each profile only
# lists what it changes; all keys of [design] are allowed.

[density.compact]
# The Milestone 2 values: Pocket PC pixel density, smallest usable text.

[density.balanced]
font_px = 14
small_font_px = 11
title_font_px = 14
date_font_px = 19
top_bar_px = 30
bottom_bar_px = 32
icon_px = 18
today_icon_px = 28
row_px = 28
target_px = 32
padding_px = 5
start_menu_width_px = 340

[density.readable]
font_px = 16
small_font_px = 13
title_font_px = 16
date_font_px = 22
top_bar_px = 36
bottom_bar_px = 40
icon_px = 22
today_icon_px = 32
row_px = 34
target_px = 38
spacing_px = 3
padding_px = 6
start_menu_width_px = 380

[density.pocketpc]
# POC 0.3 candidate: the physical sizes of a Pocket PC 2003 on the 237 ppi
# panel (22 px text = 2.35 mm, 46 px targets = 4.9 mm). Starting hypotheses
# from issue #4, to be tuned with the stylus on the real screen.
font_px = 22
small_font_px = 18
title_font_px = 22
date_font_px = 26
top_bar_px = 48
bottom_bar_px = 50
icon_px = 28
today_icon_px = 44
row_px = 44
target_px = 46
spacing_px = 4
padding_px = 8
start_menu_width_px = 400
app_dpi = 144
