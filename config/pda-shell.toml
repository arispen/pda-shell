# pda-shell configuration. Every visual measurement lives here so it can be
# tuned once the real 5" 1024x600 panel is available. Missing keys fall back
# to the built-in defaults (src/config.rs).
#
# Physical sizes on the target panel (5", 1024x600, ~237 ppi): 1 px is about
# 0.107 mm, so 12 px is 1.3 mm, 16 px 1.7 mm, 24 px 2.6 mm, 40 px 4.3 mm.
# See docs/ergonomics.md before judging sizes on a desktop monitor.

[design]
# Density profile laid over the values below; see [density.*] at the end.
# Override per session: dev-session.sh --density readable (or the
# PDA_SHELL_DENSITY environment variable).
density = "compact"
font_family = "DejaVu Sans"
font_px = 12              # body text
small_font_px = 10        # secondary text (dates, file paths)
title_font_px = 12        # status bar title
date_font_px = 16         # the date on Today
top_bar_px = 24           # status bar height
bottom_bar_px = 26        # command bar height
icon_px = 16              # icons in bars, menus and lists
today_icon_px = 24        # shortcut icons on Today
row_px = 20               # minimum height of list rows
target_px = 24            # minimum size of bar buttons, switcher and menu entries
spacing_px = 2
padding_px = 4
radius_px = 2
start_menu_width_px = 300 # landscape only; portrait uses the full width

[colors]
bar_bg = "#1d3f72"
bar_fg = "#ffffff"
bar_hover = "#2d5aa0"
bar_pressed = "#0f2547"
surface = "#ffffff"
surface_alt = "#eef2f8"
text = "#101010"
text_dim = "#5a6270"
accent = "#1f5fbf"
accent_fg = "#ffffff"
border = "#b8c2d0"
focus = "#ff9a00"

[input]
long_press_ms = 600       # hold time before a press becomes a right click
long_press_slop_px = 8    # movement that cancels a long press / starts a drag
double_tap_ms = 400
double_tap_slop_px = 10
feedback_delay_ms = 150   # progress ring appears after this much holding

[today]
# Desktop entry IDs; entries that are not installed are skipped.
shortcuts = [
    "thunar.desktop",
    "org.xfce.mousepad.desktop",
    "org.gnumeric.gnumeric.desktop",
    "atril.desktop",
    "firefox-esr.desktop",
    "xfce4-terminal.desktop",
]
recent_documents = 6

[keyboard]
# pda-onboard (scripts/bin) starts the distribution's Onboard with a fix for
# symbol keys on Debian 13; see the comment in that script.
command = ["pda-onboard"]
# Onboard's "Small" layout has Esc, Tab, Ctrl, Alt and arrow keys on the
# main layer (the default "Compact" layout has no Esc).
layout = "Small"

[start_menu]
# Technical utilities kept out of the program list. They are still found by
# search and listed under "Other programs". Settings dialogs (desktop
# category "Settings") are treated the same way automatically.
hidden = [
    "openbox.desktop",
    "x11vnc.desktop",
    "display-im*.desktop",
    "python3*.desktop",
    "thunar-bulk-rename.desktop",
    "onboard-settings.desktop",
    "onboard.desktop",          # the command bar has the keyboard button
]

[windows]
# "escape": programs may go full screen; a small "Exit full screen" button
#           stays on top so the stylus always has a way back.
# "prevent": the shell takes windows straight back out of full screen.
fullscreen = "escape"
# Move and shrink dialogs that are larger than the work area.
fit_dialogs = true

# --- Density profiles ----------------------------------------------------
# Candidates for the readability test on the real panel. Each profile only
# lists what it changes; all keys of [design] are allowed.

[density.compact]
# The Milestone 2 values: Pocket PC density, smallest usable text.

[density.balanced]
font_px = 14
small_font_px = 11
title_font_px = 14
date_font_px = 19
top_bar_px = 30
bottom_bar_px = 32
icon_px = 18
today_icon_px = 28
row_px = 28
target_px = 32
padding_px = 5
start_menu_width_px = 340

[density.readable]
font_px = 16
small_font_px = 13
title_font_px = 16
date_font_px = 22
top_bar_px = 36
bottom_bar_px = 40
icon_px = 22
today_icon_px = 32
row_px = 34
target_px = 38
spacing_px = 3
padding_px = 6
start_menu_width_px = 380
